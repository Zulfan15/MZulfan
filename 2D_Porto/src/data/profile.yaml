# ─── Missions: projects ("launch") and roles ("crew_assignment") ──────────────
missions:
  - id: aeroscan
    type: launch
    title: AeroScan — Real-Time Military Aircraft Detection
    org: Personal R&D
    start: "2026-10"
    end: null
    featured: true
    research: true
    summary: Tactical edge-AI platform that detects, classifies and tracks 15 military aircraft from satellite / aerial imagery.
    objective: Enable rapid situational awareness and automated threat identification with ultra-low-latency inference on consumer GPUs.
    results:
      - ETL pipeline converting 12 GB of PASCAL VOC CSV annotations into validated YOLO format (~8,400 curated images, 80/15/5 split).
      - Custom YOLOv11s trained with transfer learning, PyTorch 2.6, AMP FP16 and cosine-annealing LR.
      - Compiled to a TensorRT 10 FP16 engine via ONNX — 22.1 MB weights, ~1.8 ms/frame (>500 FPS) on an RTX 4060.
      - Streamlit + OpenCV command dashboard with live webcam ingestion, model switching and CSV detection audits; up to 87.9% mAP@50 (B-52).
    payload: [Python, PyTorch, YOLOv11, TensorRT, ONNX, OpenCV, Streamlit, Computer Vision]
    links: {}

  - id: foodlink
    type: launch
    title: FoodLink — Cloud-Native Food Surplus Rescue Platform
    org: Social-impact platform
    start: "2026-09"
    end: null
    featured: true
    summary: Geolocation-based food-surplus rescue and redistribution platform connecting donors, beneficiaries and volunteers.
    objective: Reduce food waste and carbon emissions with a concurrency-safe, event-driven platform that never oversells a donation.
    results:
      - Laravel 12 / PHP 8.3 backend on PostgreSQL 16 (FOR UPDATE row locks) + PostGIS GIST spatial indexing.
      - Redis 7 Lua distributed mutexes and tagged caching; Apache Kafka transactional outbox with three fan-out consumers.
      - RESTful /api/v1 with OpenAPI 3.0, Idempotency-Key protection, radius map search, coordinate fuzzing and QR/PIN handover.
      - Docker + Kubernetes (RollingUpdate, HPA, /healthz probes) via GitLab CI/CD — 32/32 automated tests passing.
    payload: [PHP, Laravel, PostgreSQL, PostGIS, Redis, Kafka, Tailwind CSS, Alpine.js, Leaflet, OpenAPI, Docker, Kubernetes, GitLab CI/CD]
    links: {}

  - id: thesis-gambling-spam
    type: launch
    title: "Thesis: Detecting Online Gambling Spam Comments on YouTube"
    org: ITENAS — Undergraduate Thesis
    start: "2025-11"
    end: "2026-06"
    featured: true
    research: true
    summary: Automated classifier that detects obfuscated online-gambling promotion in Indonesian YouTube comments.
    objective: Catch spam that hides behind text obfuscation (look-alike characters, emoji, digit padding) that keyword filters miss.
    results:
      - Hybrid features — 1,000 TF-IDF character trigrams + 9 statistical features (emoji count, digit ratio, …).
      - Random Forest tuned with GridSearchCV and validated with 10-fold stratified cross-validation.
      - 99.56% accuracy, precision, recall and F1-score.
    payload: [Python, Machine Learning, Random Forest, TF-IDF, scikit-learn, NLP]
    links: {}

  - id: omr-grading
    type: launch
    title: Automated OMR Grading Web Application
    org: Community Service Project
    start: "2025-10"
    end: "2026-01"
    featured: false
    summary: Optical Mark Recognition web system that grades scanned LJK answer sheets in bulk for teachers.
    objective: Remove hours of manual exam grading for school teachers.
    results:
      - FastAPI backend with OpenCV pipelines that detect, extract and grade filled bubbles from bulk scans and PDFs.
      - Next.js + TypeScript + Tailwind frontend with flexible exam setups, answer-key input and real-time dashboards.
      - Automated scoring, student analytics and auto-generated Excel report exports.
    payload: [Python, FastAPI, OpenCV, Computer Vision, Next.js, TypeScript, Tailwind CSS]
    links: {}

