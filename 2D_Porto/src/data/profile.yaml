# ─── Research Lab ────────────────────────────────────────────────────────────
research:
  statement: >-
    I like problems where messy real-world signals — obfuscated text, aerial imagery, noisy sensors —
    have to be turned into decisions quickly and reliably.
  methods:
    - Feature engineering & classical ML baselines before deep models
    - Transfer learning and fine-tuning on small, curated datasets
    - Rigorous validation (stratified k-fold, confusion-matrix error analysis)
    - Inference optimisation for the edge (ONNX, TensorRT, FP16)
  next:
    - Multi-object tracking and re-identification on aerial video
    - Robust Indonesian NLP against adversarial text obfuscation
    - Retrieval-augmented assistants grounded in structured personal data (like this town's twin!)

